<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Projeto | Dantas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                },
            },
        };
    </script>
    <style>
        .tech-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 0.5rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(34, 211, 238, 0.12);
            background: rgba(3, 7, 18, 0.6);
            transition: border-color 0.2s, transform 0.2s;
        }
        .tech-item:hover {
            border-color: rgba(34, 211, 238, 0.35);
            transform: translateY(-2px);
        }
        .tech-item-icon {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 0.625rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid;
        }
        .desc-paragraph {
            opacity: 0;
            transform: translateY(8px);
            animation: fadeUp 0.5s ease forwards;
        }
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
        .media-frame iframe,
        .media-frame video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body class="bg-[#030712] text-white font-sans min-h-screen flex flex-col selection:bg-cyan-400 selection:text-slate-900 relative overflow-x-hidden">

    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-cyan-500/20 rounded-full blur-[120px] pointer-events-none z-0"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-blue-600/20 rounded-full blur-[120px] pointer-events-none z-0"></div>

    <nav class="max-w-5xl mx-auto px-4 sm:px-6 py-4 relative z-10">
        <div class="flex items-center justify-between gap-3">
            <a href="index.html" class="inline-flex items-center text-cyan-400 hover:text-cyan-300 transition-colors font-medium text-sm group shrink-0">
                <svg class="w-4 h-4 mr-1.5 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Voltar
            </a>
            <p id="nav-breadcrumb" class="text-slate-500 text-xs font-mono truncate text-right">Projeto / …</p>
        </div>
    </nav>

    <main id="main-content" class="max-w-5xl mx-auto px-4 sm:px-6 pb-10 flex-grow relative z-10 opacity-0 translate-y-6 transition-all duration-500 ease-out">

        <!-- Cabeçalho compacto -->
        <header class="mb-4 space-y-2">
            <div id="project-badges" class="flex flex-wrap gap-2"></div>
            <h1 id="project-title" class="text-xl sm:text-2xl lg:text-[1.65rem] font-bold tracking-tight text-white leading-snug">Carregando…</h1>
            <p id="project-subtitle" class="text-slate-400 text-sm leading-relaxed"></p>
        </header>

        <!-- Card: vídeo + descrição + tecnologias embaixo -->
        <section class="rounded-xl border border-cyan-500/25 bg-[#0a0f1c]/80 shadow-[0_0_32px_rgba(34,211,238,0.08)] overflow-hidden">
            <div class="grid grid-cols-1 lg:grid-cols-2 lg:min-h-[320px]">
                <div class="relative aspect-video lg:aspect-auto lg:min-h-[260px] bg-black/50 border-b lg:border-b-0 lg:border-r border-cyan-500/15">
                    <div class="absolute top-0 left-0 right-0 z-20 flex items-center justify-between px-3 py-2 bg-gradient-to-b from-[#030712]/95 to-transparent">
                        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-cyan-500/15 border border-cyan-400/25 text-cyan-300 text-[10px] font-semibold uppercase tracking-wide">
                            <span class="w-1 h-1 rounded-full bg-cyan-400"></span>
                            Demo
                        </span>
                        <span id="media-type-label" class="text-slate-500 text-[10px] font-mono">Vídeo</span>
                    </div>
                    <div id="project-media-container" class="media-frame absolute inset-0"></div>
                </div>
                <div class="flex flex-col p-4 sm:p-5 lg:max-h-[380px]">
                    <h2 class="text-[10px] font-bold text-cyan-400/90 uppercase tracking-widest mb-3 shrink-0">Sobre o projeto</h2>
                    <div id="project-desc-container" class="space-y-3 text-slate-300 text-sm leading-relaxed overflow-y-auto pr-1 flex-1"></div>
                </div>
            </div>

            <!-- Faixa de tecnologias (ícones) -->
            <div id="tech-stack-bar" class="hidden border-t border-cyan-500/20 bg-[#030712]/50 px-4 sm:px-5 py-4">
                <p class="text-[10px] font-bold text-cyan-400/80 uppercase tracking-widest mb-3 text-center sm:text-left">Tecnologias utilizadas</p>
                <div id="tech-stack-grid" class="grid gap-3 justify-items-center"></div>
            </div>
        </section>
    </main>

    <script>
        const TECH_STACKS = {
            ecommerce: [
                { name: 'HTML5', desc: 'Estrutura da loja', color: 'border-orange-500/40 bg-orange-500/10', icon: '<svg class="w-5 h-5 text-orange-400" viewBox="0 0 384 512" fill="currentColor"><path d="M0 32l34.9 395.8L191.5 480l157.6-52.2L384 32H0zm308.2 127.9H124.4l4.1 49.4h175.6l-13.6 148.4-97.9 27v.3h-1.1l-98.7-27.3-6-75.8h47.7L138 320l53.5 14.5 53.7-14.5 6-62.2H84.3L71.5 112.2h241.1l-4.4 47.7z"/></svg>' },
                { name: 'React', desc: 'Interface dinâmica', color: 'border-cyan-400/40 bg-cyan-400/10', icon: '<svg class="w-5 h-5 text-cyan-400" viewBox="-11.5 -10.23174 23 20.46348" fill="none" stroke="currentColor" stroke-width="1"><circle cx="0" cy="0" r="2.05" fill="currentColor" stroke="none"/><ellipse rx="11" ry="4.2"/><ellipse rx="11" ry="4.2" transform="rotate(60)"/><ellipse rx="11" ry="4.2" transform="rotate(120)"/></svg>' },
                { name: 'PHP', desc: 'Backend da loja', color: 'border-indigo-400/40 bg-indigo-400/10', icon: '<svg class="w-5 h-5 text-indigo-300" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.25C5.373 1.25 0 6.262 0 12.5s5.373 11.25 12 11.25 12-5.012 12-11.25S18.627 1.25 12 1.25z"/></svg>' },
                { name: 'MySQL', desc: 'Banco de dados', color: 'border-blue-400/40 bg-blue-400/10', icon: '<svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>' },
            ],
            bot: [
                { name: 'Python', desc: 'Lógica do bot', color: 'border-[#FFD43B]/40 bg-[#3776AB]/20', icon: '<svg class="w-5 h-5" viewBox="0 0 448 512"><path fill="#FFD43B" d="M224 32c-63 0-58 28-58 28v29h59v9H85s-58-1-58 57 26 58 26 58h31v-28s-2-36 36-36h62v-54s-5-36 57-36 58 28 58 28v29h-56v9h115s58 1 58-57-25-58-25-58h-31v28s3 36-36 36h-62v54z"/><path fill="#3776AB" d="M122 384c63 0 58-28 58-28v-29h-59v-9h140s58 1 58-57-26-58-26-58h-31v28s2 36-36 36h-62v54s5 36-57 36-58-28-58-28v-29h56v-9H67s-58-1-58 57 25 58 25 58h31v-28s-3-36 36-36h62v-54z"/></svg>' },
                { name: 'Selenium', desc: 'Automação web', color: 'border-[#43B02A]/50 bg-[#43B02A]/15', icon: '<span class="text-sm font-extrabold text-[#5fd35f] tracking-tighter">Se</span>' },
                { name: 'MySQL', desc: 'Persistência', color: 'border-blue-400/40 bg-blue-400/10', icon: '<svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>' },
                { name: 'Discord', desc: 'Notificações', color: 'border-indigo-400/40 bg-indigo-500/15', icon: '<svg class="w-5 h-5 text-indigo-300" viewBox="0 0 640 512" fill="currentColor"><path d="M524.531 69.836a1.5 1.5 0 0 0-.764-.7A485.065 485.065 0 0 0 404.081 32.03a1.816 1.816 0 0 0-1.923.91 337.461 337.461 0 0 0-14.9 30.6 447.848 447.848 0 0 0-134.426 0 309.541 309.541 0 0 0-15.135-30.6 1.89 1.89 0 0 0-1.924-.91A483.689 483.689 0 0 0 116.085 69.137a1.712 1.712 0 0 0-.788.676C39.068 183.651 18.186 294.69 28.43 404.354a2.016 2.016 0 0 0 .765 1.375A487.666 487.666 0 0 0 176.02 479.918a1.9 1.9 0 0 0 2.063-.276c8.3-11.39 15.3-23.32 21.573-35.6a1.88 1.88 0 0 0-1.025-2.61c-19.145-7.25-37.456-16.14-55.01-26.33a1.86 1.86 0 0 1-.137-3.13c4.13-3.11 8.21-6.3 12.16-9.59a1.87 1.87 0 0 1 1.95-.29c83.1 37.81 173.23 37.81 255.45 0a1.87 1.87 0 0 1 1.95.29c3.95 3.29 8.03 6.48 12.16 9.59a1.85 1.85 0 0 1-.14 3.13c-17.55 10.2-35.86 19.08-55.01 26.33a1.88 1.88 0 0 0-1.025 2.61c6.27 12.28 13.27 24.21 21.57 35.6a1.9 1.9 0 0 0 2.06.276A487.666 487.666 0 0 0 611.534 405.729a2.016 2.016 0 0 0 .765-1.375C624.4 281.341 598.665 172.3 524.531 69.836z"/></svg>' },
            ],
            qa: [
                { name: 'Python', desc: 'Scripts de teste', color: 'border-[#FFD43B]/40 bg-[#3776AB]/20', icon: '<svg class="w-5 h-5" viewBox="0 0 448 512"><path fill="#FFD43B" d="M224 32c-63 0-58 28-58 28v29h59v9H85s-58-1-58 57 26 58 26 58h31v-28s-2-36 36-36h62v-54s-5-36 57-36 58 28 58 28v29h-56v9h115s58 1 58-57-25-58-25-58h-31v28s3 36-36 36h-62v54z"/><path fill="#3776AB" d="M122 384c63 0 58-28 58-28v-29h-59v-9h140s58 1 58-57-26-58-26-58h-31v28s2 36-36 36h-62v54s5 36-57 36-58-28-58-28v-29h56v-9H67s-58-1-58 57 25 58 25 58h31v-28s-3-36 36-36h62v-54z"/></svg>' },
                { name: 'Selenium', desc: 'WebDriver / browser', color: 'border-[#43B02A]/50 bg-[#43B02A]/15', icon: '<span class="text-sm font-extrabold text-[#5fd35f] tracking-tighter">Se</span>' },
                { name: 'Relatório .txt', desc: 'Log da execução', color: 'border-amber-400/40 bg-amber-500/10', icon: '<svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path stroke-linecap="round" stroke-linejoin="round" d="M14 2v6h6"/><path stroke-linecap="round" stroke-linejoin="round" d="m9 15 2 2 4-4"/></svg>' },
            ],
        };

        function getProjectType(titulo) {
            const t = titulo.toLowerCase();
            if (t.includes('e-commerce') || t.includes('ecommerce')) return 'ecommerce';
            if (t.includes('linkedin') || t.includes('assistente')) return 'bot';
            if (t.includes('automação') || t.includes('automacao') || t.includes('garantia') || t.includes('qa')) return 'qa';
            return null;
        }

        function renderTechStack(type) {
            const items = TECH_STACKS[type];
            if (!items) return;
            const bar = document.getElementById('tech-stack-bar');
            const grid = document.getElementById('tech-stack-grid');
            const gridCols = items.length === 4
                ? 'grid-cols-2 sm:grid-cols-4'
                : items.length === 3
                    ? 'grid-cols-3'
                    : 'grid-cols-2';
            grid.className = `grid gap-3 justify-items-center ${gridCols}`;

            bar.classList.remove('hidden');
            grid.innerHTML = items.map(item => `
                <div class="tech-item w-full max-w-[140px]" title="${item.desc}">
                    <div class="tech-item-icon ${item.color}">${item.icon}</div>
                    <span class="text-xs font-semibold text-slate-300 text-center leading-tight">${item.name}</span>
                </div>
            `).join('');
        }

        function renderBadges(type) {
            const el = document.getElementById('project-badges');
            const badges = {
                qa: [
                    { text: 'Quality Assurance', class: 'bg-teal-500/15 text-teal-300 border-teal-500/30' },
                ],
                ecommerce: [
                    { text: 'Full Stack', class: 'bg-cyan-500/15 text-cyan-300 border-cyan-500/30' },
                    { text: 'E-commerce', class: 'bg-blue-500/15 text-blue-300 border-blue-500/30' },
                ],
                bot: [
                    { text: 'Automação', class: 'bg-green-500/15 text-green-300 border-green-500/30' },
                ],
            };
            const list = badges[type] || [{ text: 'Projeto', class: 'bg-cyan-500/15 text-cyan-300 border-cyan-500/30' }];
            el.innerHTML = list.map(b => `
                <span class="px-3 py-1 rounded-full text-[10px] sm:text-xs font-bold uppercase tracking-wider border ${b.class}">${b.text}</span>
            `).join('');
        }

        function renderDescription(text) {
            const container = document.getElementById('project-desc-container');
            const paragraphs = text.split(/\n\n+/).filter(Boolean);
            container.innerHTML = paragraphs.map((p, i) => `
                <p class="desc-paragraph" style="animation-delay: ${i * 0.12}s">${p.trim()}</p>
            `).join('');
        }

        const projetoString = localStorage.getItem('projetoAtual');

        if (!projetoString) {
            window.location.href = 'index.html';
        } else {
            const projeto = JSON.parse(projetoString);
            const projectType = getProjectType(projeto.titulo);

            document.title = `${projeto.titulo} | Dantas`;
            document.getElementById('project-title').textContent = projeto.titulo;
            document.getElementById('nav-breadcrumb').textContent = `Projeto / ${projeto.titulo}`;

            const subtitles = {
                qa: 'Teste automatizado com Python e Selenium para validar garantia de produto, com relatório de execução em .txt.',
                ecommerce: 'Plataforma completa de vendas com vitrine para o cliente e painel administrativo para o lojista.',
                bot: 'Automação inteligente para otimizar processos repetitivos com integrações e notificações.',
            };
            document.getElementById('project-subtitle').textContent = subtitles[projectType] || 'Detalhes e stack utilizados neste projeto.';

            renderBadges(projectType);
            renderTechStack(projectType);
            renderDescription(projeto.descricao);

            setTimeout(() => {
                const main = document.getElementById('main-content');
                main.classList.remove('opacity-0', 'translate-y-8');
            }, 80);

            const midiaList = Array.isArray(projeto.midia) ? projeto.midia : [projeto.midia];
            window.currentMediaIndex = 0;

            window.renderMedia = function(index) {
                window.currentMediaIndex = index;
                const mediaContainer = document.getElementById('project-media-container');
                const mediaLabel = document.getElementById('media-type-label');
                const midiaUrl = midiaList[index] ? midiaList[index].trim() : '';
                let mediaHtml = '';

                if (midiaUrl.match(/\.(mp4|webm|ogg|mov)([?#].*)?$/i)) {
                    mediaHtml = `<video src="${midiaUrl}" controls class="w-full h-full object-contain bg-black"></video>`;
                    mediaLabel.textContent = 'Vídeo local';
                } else if (midiaUrl.match(/(youtube\.com\/watch\?.*v=|youtu\.be\/)([^&]+)/i)) {
                    const ytId = midiaUrl.match(/(youtube\.com\/watch\?.*v=|youtu\.be\/)([^&]+)/i)[2];
                    mediaHtml = `<iframe src="https://www.youtube.com/embed/${ytId}?rel=0" allowfullscreen loading="lazy"></iframe>`;
                    mediaLabel.textContent = 'YouTube';
                } else if (midiaUrl.match(/vimeo\.com\/(?:video\/)?(\d+)/i)) {
                    const vimeoId = midiaUrl.match(/vimeo\.com\/(?:video\/)?(\d+)/i)[1];
                    mediaHtml = `<iframe src="https://player.vimeo.com/video/${vimeoId}?title=0&byline=0&portrait=0&color=22d3ee" allow="fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
                    mediaLabel.textContent = 'Vimeo';
                } else {
                    mediaHtml = `<img src="${midiaUrl}" alt="${projeto.titulo}" class="w-full h-full object-contain" onerror="this.onerror=null;this.src='https://placehold.co/800x600/0a0f1c/22d3ee?text=Midia+indisponivel';" />`;
                    mediaLabel.textContent = 'Imagem';
                }

                if (midiaList.length > 1) {
                    mediaContainer.classList.add('group');
                    mediaHtml += `
                        <button type="button" onclick="renderMedia((window.currentMediaIndex - 1 + ${midiaList.length}) % ${midiaList.length})" class="absolute left-3 top-1/2 -translate-y-1/2 z-30 bg-black/60 hover:bg-cyan-500 text-white w-10 h-10 flex items-center justify-center rounded-full backdrop-blur-md transition-all border border-white/10" aria-label="Anterior">&#10094;</button>
                        <button type="button" onclick="renderMedia((window.currentMediaIndex + 1) % ${midiaList.length})" class="absolute right-3 top-1/2 -translate-y-1/2 z-30 bg-black/60 hover:bg-cyan-500 text-white w-10 h-10 flex items-center justify-center rounded-full backdrop-blur-md transition-all border border-white/10" aria-label="Próximo">&#10095;</button>
                        <div class="absolute bottom-3 left-1/2 -translate-x-1/2 z-30 flex gap-2 bg-black/50 px-3 py-1.5 rounded-full backdrop-blur-md border border-white/10">
                            ${midiaList.map((_, i) => `<span class="w-2 h-2 rounded-full transition-all ${i === index ? 'bg-cyan-400 w-5' : 'bg-white/40'}"></span>`).join('')}
                        </div>
                    `;
                }

                mediaContainer.innerHTML = mediaHtml;
            };

            renderMedia(window.currentMediaIndex);
        }
    </script>
</body>
</html>
