<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Projeto | Dantas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { overflow-x: hidden; max-width: 100vw; }
        .media-wrap { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
        .media-wrap .media-frame { position: absolute; inset: 0; overflow: hidden; }
        .media-wrap iframe, .media-wrap video, .media-wrap img {
            position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: contain;
        }
        .tech-scroll { -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .tech-scroll::-webkit-scrollbar { display: none; }
        .tech-card {
            flex: 0 0 auto;
            width: 5.5rem;
            display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
            padding: 0.75rem 0.5rem; border-radius: 0.75rem;
            border: 1px solid rgba(34,211,238,0.15); background: rgba(3,7,18,0.8);
        }
        .tech-card-icon {
            width: 2.25rem; height: 2.25rem; border-radius: 0.5rem;
            display: flex; align-items: center; justify-content: center; border: 1px solid;
        }
        @media (min-width: 1024px) {
            .tech-scroll { display: grid !important; overflow: visible; }
            .tech-card { width: auto; flex: 1; }
        }
    </style>
</head>
<body class="bg-[#030712] text-white font-sans min-h-screen">

    <header class="sticky top-0 z-50 bg-[#030712]/95 backdrop-blur border-b border-cyan-500/15 px-4 py-3">
        <a href="index.html" class="inline-flex items-center text-cyan-400 text-sm font-medium">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            Voltar ao portfólio
        </a>
    </header>

    <main id="main-content" class="w-full max-w-4xl mx-auto px-4 py-5 pb-10 opacity-0 transition-opacity duration-300">

        <div id="project-badges" class="flex flex-wrap gap-2 mb-3"></div>
        <h1 id="project-title" class="text-[1.35rem] sm:text-2xl font-bold text-white leading-tight mb-2">Carregando…</h1>
        <p id="project-subtitle" class="text-slate-400 text-sm leading-relaxed mb-5"></p>

        <div class="rounded-xl border border-cyan-500/20 bg-[#0a0f1c]/90 overflow-hidden">

            <!-- Vídeo -->
            <div class="media-wrap">
                <div class="absolute top-0 left-0 right-0 z-10 flex justify-between px-3 py-2 bg-gradient-to-b from-black/80 to-transparent pointer-events-none">
                    <span class="text-[10px] font-bold text-cyan-300 uppercase tracking-wide">Demo</span>
                    <span id="media-type-label" class="text-[10px] text-slate-500 font-mono">Vídeo</span>
                </div>
                <div id="project-media-container" class="media-frame"></div>
            </div>

            <!-- Tecnologias (logo após o vídeo no mobile) -->
            <div id="tech-stack-bar" class="hidden border-y border-cyan-500/15 bg-[#030712]/60 px-4 py-4">
                <p class="text-[10px] font-bold text-cyan-400 uppercase tracking-widest mb-3">Tecnologias</p>
                <div id="tech-stack-grid" class="tech-scroll flex gap-3 overflow-x-auto snap-x snap-mandatory lg:grid lg:grid-cols-4 lg:gap-3 lg:overflow-visible"></div>
            </div>

            <!-- Descrição -->
            <div class="p-4 sm:p-5">
                <h2 class="text-[10px] font-bold text-cyan-400 uppercase tracking-widest mb-3">Sobre o projeto</h2>
                <div id="project-desc-container" class="space-y-3 text-slate-300 text-sm leading-relaxed"></div>
            </div>
        </div>
    </main>

    <script>
        const TECH_STACKS = {
            ecommerce: [
                { name: 'HTML5', color: 'border-orange-500/40 bg-orange-500/10', icon: '<svg class="w-5 h-5 text-orange-400" viewBox="0 0 384 512" fill="currentColor"><path d="M0 32l34.9 395.8L191.5 480l157.6-52.2L384 32H0zm308.2 127.9H124.4l4.1 49.4h175.6l-13.6 148.4-97.9 27v.3h-1.1l-98.7-27.3-6-75.8h47.7L138 320l53.5 14.5 53.7-14.5 6-62.2H84.3L71.5 112.2h241.1l-4.4 47.7z"/></svg>' },
                { name: 'React', color: 'border-cyan-400/40 bg-cyan-400/10', icon: '<svg class="w-5 h-5 text-cyan-400" viewBox="-11.5 -10.23174 23 20.46348" fill="none" stroke="currentColor" stroke-width="1"><circle cx="0" cy="0" r="2.05" fill="currentColor" stroke="none"/><ellipse rx="11" ry="4.2"/><ellipse rx="11" ry="4.2" transform="rotate(60)"/><ellipse rx="11" ry="4.2" transform="rotate(120)"/></svg>' },
                { name: 'PHP', color: 'border-indigo-400/40 bg-indigo-400/10', icon: '<svg class="w-5 h-5 text-indigo-300" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.25C5.373 1.25 0 6.262 0 12.5s5.373 11.25 12 11.25 12-5.012 12-11.25S18.627 1.25 12 1.25z"/></svg>' },
                { name: 'MySQL', color: 'border-blue-400/40 bg-blue-400/10', icon: '<svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>' },
            ],
            bot: [
                { name: 'Python', color: 'border-[#FFD43B]/40 bg-[#3776AB]/20', icon: '<svg class="w-5 h-5" viewBox="0 0 448 512"><path fill="#FFD43B" d="M224 32c-63 0-58 28-58 28v29h59v9H85s-58-1-58 57 26 58 26 58h31v-28s-2-36 36-36h62v-54s-5-36 57-36 58 28 58 28v29h-56v9h115s58 1 58-57-25-58-25-58h-31v28s3 36-36 36h-62v54z"/><path fill="#3776AB" d="M122 384c63 0 58-28 58-28v-29h-59v-9h140s58 1 58-57-26-58-26-58h-31v28s2 36-36 36h-62v54s5 36-57 36-58-28-58-28v-29h56v-9H67s-58-1-58 57 25 58 25 58h31v-28s-3-36 36-36h62v-54z"/></svg>' },
                { name: 'Selenium', color: 'border-[#43B02A]/50 bg-[#43B02A]/15', icon: '<span class="text-sm font-extrabold text-[#5fd35f]">Se</span>' },
                { name: 'MySQL', color: 'border-blue-400/40 bg-blue-400/10', icon: '<svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>' },
                { name: 'Discord', color: 'border-indigo-400/40 bg-indigo-500/15', icon: '<svg class="w-5 h-5 text-indigo-300" viewBox="0 0 640 512" fill="currentColor"><path d="M524.531 69.836a1.5 1.5 0 0 0-.764-.7A485.065 485.065 0 0 0 404.081 32.03a1.816 1.816 0 0 0-1.923.91 337.461 337.461 0 0 0-14.9 30.6 447.848 447.848 0 0 0-134.426 0 309.541 309.541 0 0 0-15.135-30.6 1.89 1.89 0 0 0-1.924-.91A483.689 483.689 0 0 0 116.085 69.137a1.712 1.712 0 0 0-.788.676C39.068 183.651 18.186 294.69 28.43 404.354a2.016 2.016 0 0 0 .765 1.375A487.666 487.666 0 0 0 176.02 479.918a1.9 1.9 0 0 0 2.063-.276c8.3-11.39 15.3-23.32 21.573-35.6a1.88 1.88 0 0 0-1.025-2.61c-19.145-7.25-37.456-16.14-55.01-26.33a1.86 1.86 0 0 1-.137-3.13c4.13-3.11 8.21-6.3 12.16-9.59a1.87 1.87 0 0 1 1.95-.29c83.1 37.81 173.23 37.81 255.45 0a1.87 1.87 0 0 1 1.95.29c3.95 3.29 8.03 6.48 12.16 9.59a1.85 1.85 0 0 1-.14 3.13c-17.55 10.2-35.86 19.08-55.01 26.33a1.88 1.88 0 0 0-1.025 2.61c6.27 12.28 13.27 24.21 21.57 35.6a1.9 1.9 0 0 0 2.06.276A487.666 487.666 0 0 0 611.534 405.729a2.016 2.016 0 0 0 .765-1.375C624.4 281.341 598.665 172.3 524.531 69.836z"/></svg>' },
            ],
            qa: [
                { name: 'Python', color: 'border-[#FFD43B]/40 bg-[#3776AB]/20', icon: '<svg class="w-5 h-5" viewBox="0 0 448 512"><path fill="#FFD43B" d="M224 32c-63 0-58 28-58 28v29h59v9H85s-58-1-58 57 26 58 26 58h31v-28s-2-36 36-36h62v-54s-5-36 57-36 58 28 58 28v29h-56v9h115s58 1 58-57-25-58-25-58h-31v28s3 36-36 36h-62v54z"/><path fill="#3776AB" d="M122 384c63 0 58-28 58-28v-29h-59v-9h140s58 1 58-57-26-58-26-58h-31v28s2 36-36 36h-62v54s5 36-57 36-58-28-58-28v-29h56v-9H67s-58-1-58 57 25 58 25 58h31v-28s-3-36 36-36h62v-54z"/></svg>' },
                { name: 'Selenium', color: 'border-[#43B02A]/50 bg-[#43B02A]/15', icon: '<span class="text-sm font-extrabold text-[#5fd35f]">Se</span>' },
                { name: 'Relatório', color: 'border-amber-400/40 bg-amber-500/10', icon: '<svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path stroke-linecap="round" stroke-linejoin="round" d="m9 15 2 2 4-4"/></svg>' },
            ],
        };

        function getProjectType(titulo) {
            const t = titulo.toLowerCase();
            if (t.includes('e-commerce') || t.includes('ecommerce')) return 'ecommerce';
            if (t.includes('linkedin') || t.includes('assistente')) return 'bot';
            if (t.includes('automação') || t.includes('automacao') || t.includes('garantia') || t.includes('qa')) return 'qa';
            return null;
        }

        const TECH_BY_NAME = {};
        Object.values(TECH_STACKS).flat().forEach(item => { TECH_BY_NAME[item.name.toLowerCase()] = item; });
        TECH_BY_NAME['relatório .txt'] = TECH_BY_NAME['relatório'] = TECH_STACKS.qa[2];
        TECH_BY_NAME['html'] = TECH_STACKS.ecommerce[0];

        function renderTechFromTags(tags) {
            if (!tags || !tags.length) return false;
            const items = tags.map(tag => {
                const key = tag.toLowerCase().replace(/\s*\.txt\s*/i, '').trim();
                const found = TECH_BY_NAME[key] || TECH_BY_NAME[tag.toLowerCase()];
                if (found) return { ...found, name: tag };
                return {
                    name: tag,
                    color: 'border-cyan-400/30 bg-cyan-400/10',
                    icon: '<span class="text-xs font-bold text-cyan-300">' + tag.slice(0, 2) + '</span>'
                };
            });
            const bar = document.getElementById('tech-stack-bar');
            const grid = document.getElementById('tech-stack-grid');
            const cols = items.length <= 3 ? 'lg:grid-cols-3' : 'lg:grid-cols-4';
            grid.className = `tech-scroll flex gap-3 overflow-x-auto snap-x snap-mandatory lg:grid ${cols} lg:gap-3 lg:overflow-visible`;
            bar.classList.remove('hidden');
            grid.innerHTML = items.map(item => `
                <div class="tech-card snap-center" title="${item.name}">
                    <div class="tech-card-icon ${item.color}">${item.icon}</div>
                    <span class="text-[10px] font-semibold text-slate-300 text-center leading-tight">${item.name}</span>
                </div>
            `).join('');
            return true;
        }

        function renderTechStack(type) {
            const items = TECH_STACKS[type];
            if (!items) return;
            const bar = document.getElementById('tech-stack-bar');
            const grid = document.getElementById('tech-stack-grid');
            const cols = items.length === 3 ? 'lg:grid-cols-3' : 'lg:grid-cols-4';
            grid.className = `tech-scroll flex gap-3 overflow-x-auto snap-x snap-mandatory lg:grid ${cols} lg:gap-3 lg:overflow-visible`;
            bar.classList.remove('hidden');
            grid.innerHTML = items.map(item => `
                <div class="tech-card snap-center" title="${item.name}">
                    <div class="tech-card-icon ${item.color}">${item.icon}</div>
                    <span class="text-[10px] font-semibold text-slate-300 text-center leading-tight">${item.name}</span>
                </div>
            `).join('');
        }

        function renderBadges(type, category) {
            if (category) {
                const isQa = /qa|qualidade|automação|automacao/i.test(category);
                const cls = isQa
                    ? 'bg-teal-500/15 text-teal-300 border-teal-500/30'
                    : 'bg-cyan-500/15 text-cyan-300 border-cyan-500/30';
                document.getElementById('project-badges').innerHTML =
                    `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase border ${cls}">${category}</span>`;
                return;
            }
            const badges = {
                qa: [{ text: 'QA', class: 'bg-teal-500/15 text-teal-300 border-teal-500/30' }],
                ecommerce: [
                    { text: 'Full Stack', class: 'bg-cyan-500/15 text-cyan-300 border-cyan-500/30' },
                    { text: 'E-commerce', class: 'bg-blue-500/15 text-blue-300 border-blue-500/30' },
                ],
                bot: [{ text: 'Automação', class: 'bg-green-500/15 text-green-300 border-green-500/30' }],
            };
            const list = badges[type] || [{ text: 'Projeto', class: 'bg-cyan-500/15 text-cyan-300 border-cyan-500/30' }];
            document.getElementById('project-badges').innerHTML = list.map(b =>
                `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase border ${b.class}">${b.text}</span>`
            ).join('');
        }

        function renderDescription(text) {
            document.getElementById('project-desc-container').innerHTML = text
                .split(/\n\n+/).filter(Boolean)
                .map(p => `<p>${p.trim()}</p>`).join('');
        }

        const projetoString = localStorage.getItem('projetoAtual');
        if (!projetoString) {
            window.location.href = 'index.html';
        } else {
            const projeto = JSON.parse(projetoString);
            const projectType = getProjectType(projeto.titulo);

            document.title = `${projeto.titulo} | Dantas`;
            document.getElementById('project-title').textContent = projeto.titulo;

            const subtitles = {
                qa: 'Automação com Python e Selenium + relatório .txt',
                ecommerce: 'Loja + painel administrativo',
                bot: 'Bot com integrações automatizadas',
            };
            const subtitleEl = document.getElementById('project-subtitle');
            const subtitleText = projeto.excerpt || subtitles[projectType] || '';
            subtitleEl.textContent = subtitleText;
            subtitleEl.classList.toggle('hidden', !subtitleText);

            renderBadges(projectType, projeto.category);
            if (!renderTechFromTags(projeto.tags)) renderTechStack(projectType);
            renderDescription(projeto.descricao);

            requestAnimationFrame(() => {
                document.getElementById('main-content').classList.remove('opacity-0');
            });

            const midiaList = Array.isArray(projeto.midia) ? projeto.midia : [projeto.midia];
            window.currentMediaIndex = 0;

            window.renderMedia = function(index) {
                window.currentMediaIndex = index;
                const box = document.getElementById('project-media-container');
                const label = document.getElementById('media-type-label');
                const url = (midiaList[index] || '').trim();
                let html = '';

                if (url.match(/\.(mp4|webm|ogg|mov)([?#].*)?$/i)) {
                    html = `<video src="${url}" controls playsinline></video>`;
                    label.textContent = 'MP4';
                } else if (url.match(/(youtube\.com\/watch\?.*v=|youtu\.be\/)([^&]+)/i)) {
                    const id = url.match(/(youtube\.com\/watch\?.*v=|youtu\.be\/)([^&]+)/i)[2];
                    html = `<iframe src="https://www.youtube.com/embed/${id}" allowfullscreen loading="lazy"></iframe>`;
                    label.textContent = 'YouTube';
                } else if (url.match(/vimeo\.com\/(?:video\/)?(\d+)/i)) {
                    const id = url.match(/vimeo\.com\/(?:video\/)?(\d+)/i)[1];
                    html = `<iframe src="https://player.vimeo.com/video/${id}?title=0&byline=0&portrait=0" allowfullscreen loading="lazy"></iframe>`;
                    label.textContent = 'Vimeo';
                } else {
                    html = `<img src="${url}" alt="${projeto.titulo}" onerror="this.src='https://placehold.co/800x450/0a0f1c/22d3ee?text=Sem+midia'">`;
                    label.textContent = 'Imagem';
                }

                if (midiaList.length > 1) {
                    html += `
                        <button type="button" onclick="renderMedia((window.currentMediaIndex-1+${midiaList.length})%${midiaList.length})" class="absolute left-2 top-1/2 -translate-y-1/2 z-20 w-9 h-9 rounded-full bg-black/70 text-white text-lg border border-white/20" aria-label="Anterior">‹</button>
                        <button type="button" onclick="renderMedia((window.currentMediaIndex+1)%${midiaList.length})" class="absolute right-2 top-1/2 -translate-y-1/2 z-20 w-9 h-9 rounded-full bg-black/70 text-white text-lg border border-white/20" aria-label="Próximo">›</button>`;
                }
                box.innerHTML = html;
            };

            renderMedia(0);
        }
    </script>
</body>
</html>
