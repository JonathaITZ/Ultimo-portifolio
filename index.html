    <!-- Código React embutido para evitar o bloqueio de segurança (CORS) da tela branca -->
    <script type="text/babel" data-presets="react">
      /** @jsx React.createElement */
      const { useState, useEffect, useRef } = React;
      const { motion, AnimatePresence } = window.Motion || window.FramerMotion;

      // Componente ProfileCard com as animações de Hover e tema Cyberpunk/Dashboard
      function ProfileCard({ profileImage, isDevMode, onProfileClick }) {
        const [isHovered, setIsHovered] = useState(false);
        const [isMobile, setIsMobile] = useState(false);
        const bannerImg = "https://i.ibb.co/WW8mM97g/e32fe65b-639e-46ad-98a4-41eeed5bf1e5.jpg";

        // Detecta o tamanho da tela para adaptar a animação
        useEffect(() => {
          const handleResize = () => setIsMobile(window.innerWidth < 640); // 640px = breakpoint sm no Tailwind
          handleResize();
          window.addEventListener('resize', handleResize);
          return () => window.removeEventListener('resize', handleResize);
        }, []);

        // Valores responsivos para a animação
        const ellipseHoverX = isMobile ? -80 : -150;
        const cardHoverWidth = isMobile ? 220 : 340;
        const cardHoverX = isMobile ? -40 : -100;

        return (
          <div 
            className="relative flex items-center justify-center w-full max-w-[600px] h-[130px] sm:h-[180px] cursor-pointer mx-auto mb-2"
            onMouseEnter={() => !isMobile && setIsHovered(true)} 
            onMouseLeave={() => !isMobile && setIsHovered(false)}
            onClick={() => isMobile && setIsHovered(!isHovered)}
          >
            <div className="relative flex items-center justify-center">
              
              {/* 1. A ELIPSE (FOTO DE PERFIL) */}
              <motion.div
                animate={{ 
                  x: isHovered ? ellipseHoverX : 0,
                  scale: isHovered ? (isMobile ? 1.02 : 1.05) : 1
                }}
                transition={{ type: "spring", stiffness: 100, damping: 20 }}
              className={`relative z-20 w-28 h-28 sm:w-40 sm:h-40 rounded-full p-1 bg-gradient-to-tr from-cyan-400 to-blue-600 shadow-[0_0_30px_rgba(0,242,255,0.4)] ${isDevMode ? 'cursor-pointer' : 'cursor-default'}`}
                onClick={onProfileClick}
              >
                <div className="w-full h-full rounded-full overflow-hidden border-[4px] border-[#030712] bg-[#020617]">
                  <img 
                    src={profileImage} 
                    alt="Perfil" 
                    className="w-full h-full object-cover"
                    onError={(e) => { e.target.onerror = null; e.target.src = "data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22200%22%20height%3D%22200%22%3E%3Crect%20width%3D%22200%22%20height%3D%22200%22%20fill%3D%22%23020617%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20font-family%3D%22sans-serif%22%20font-size%3D%2235%22%20font-weight%3D%22bold%22%20fill%3D%22%2300f2ff%22%20dominant-baseline%3D%22middle%22%20text-anchor%3D%22middle%22%3EPerfil%3C%2Ftext%3E%3C%2Fsvg%3E"; }} 
                  />
                </div>
              </motion.div>

              {/* 2. O CARD (RETÂNGULO) */}
              <motion.div
                initial={false}
                style={{ originX: 0 }}
                animate={{ 
                  width: isHovered ? cardHoverWidth : 0,
                  opacity: isHovered ? 1 : 0,
                  x: isHovered ? cardHoverX : 0, // Desliza para criar a sobreposição adaptada
                }}
                transition={{ type: "spring", stiffness: 100, damping: 20 }}
                className="absolute left-[50%] z-10 h-24 sm:h-36 bg-[#0a0f1c] border border-cyan-500/30 rounded-r-2xl overflow-hidden shadow-[0_0_25px_rgba(0,242,255,0.2)]"
              >
                <div style={{ width: cardHoverWidth }} className="h-full relative">
                  <img 
                    src={bannerImg} 
                    alt="Banner" 
                    className="w-full h-full object-cover opacity-80"
                  />
                  {/* Overlay Escuro Mesclado com a Foto */}
                  <div className="absolute inset-0 bg-gradient-to-r from-[#030712] via-transparent to-transparent"></div>
                  
                  {/* Texto Interno do Card */}
                  <div className="absolute inset-0 flex flex-col justify-center items-end pr-6 pointer-events-none">
                    <p className="text-[10px] text-cyan-400/80 tracking-[0.3em] font-mono">SYSTEM ACTIVE</p>
                  </div>
                </div>
              </motion.div>

            </div>
          </div>
        );
      }

          if (c.includes('full') || c.includes('stack') || c.includes('e-commerce') || c.includes('ecommerce')) return 'fullstack';
          return 'other';
        };

        const getProjectPreview = (proj) => {
          const excerpt = proj.excerpt || (proj.description || '').split('\n\n')[0];
          const tags = proj.tags || [];
          const category = proj.category || 'Projeto';
          const filterKey = getProjectFilterKey(category);
          const isQa = filterKey === 'qa';
          const midiaList = Array.isArray(proj.media) ? proj.media : String(proj.media || '').split('\n').map(s => s.trim()).filter(Boolean);

          const hasBanner = Boolean(bannerUrl);

          return { excerpt, tags, category, mediaUrl, bannerUrl, cardUrl, hasBanner, isVideo, isCardVideo, filterKey, isQa, mediaLabel, midiaCount: midiaList.length };
        };

            return <img src={preview.bannerUrl} alt={`Banner — ${title}`} onError={onImgError} className={imgClass} />;

        const handleAddProject = (e) => {
          e.preventDefault();

          const mediaUrls = String(newProject.media || '').split('\n').map(s => s.trim()).filter(Boolean);
          
          // Validação de segurança para links do Lightshot (prnt.sc)
          if (mediaUrls.some(url => url.includes('prnt.sc/') && !url.match(/\.(jpeg|jpg|gif|png|webp)$/i))) {
            alert('⚠️ Link do Lightshot incomum!\n\nVocê copiou o link da página web. Para a foto aparecer no projeto, acesse esse link no navegador, clique com o botão direito na imagem e escolha "Copiar endereço da imagem".');
            return;
          }
          
          const finalMedia = mediaUrls; // Agora salva sempre como um array de mídias
          
          let updatedProjects;

            updatedProjects = [...projects];
            updatedProjects[editingIndex] = { ...newProject, media: finalMedia };

            updatedProjects = [...projects, { ...newProject, media: finalMedia }];

          setProjects(updatedProjects);
          setNewProject({ title: '', media: '', description: '' }); // Limpa o form
          
          alert("⚠️ PROJETO ADICIONADO VISUALMENTE!\n\nEle vai sumir se você der F5 agora. Para salvar de vez no código:\n1. Role a tela para cima.\n2. Clique no botão amarelo '📋 COPIAR CÓDIGO DOS PROJETOS'.\n3. Abra o seu index.html, cole o código lá e salve o arquivo.");
        };

        const editProject = (idx, e) => {
          e.stopPropagation();
          setEditingIndex(idx);
          const proj = projects[idx];
          setNewProject({ ...proj, media: Array.isArray(proj.media) ? proj.media.join('\n') : (proj.media || '') });
