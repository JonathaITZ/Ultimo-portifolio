      // =========================================================================
      // THREE.JS BACKGROUND
      // =========================================================================
      function ThreeBackground() {
        useEffect(() => {
          const canvas = document.getElementById('bg-3d');
          if (!canvas || !window.THREE) return;

          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
          const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });

          renderer.setSize(window.innerWidth, window.innerHeight);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

          const planetGroup = new THREE.Group();

          // 1. Esfera do Planeta
          const sphereGeo = new THREE.SphereGeometry(3.8, 40, 40);
          const wireframeGeo = new THREE.WireframeGeometry(sphereGeo);
          const sphereMat = new THREE.LineBasicMaterial({
            color: 0x38bdf8,
            transparent: true,
            opacity: 0.12
          });
          const planetMesh = new THREE.LineSegments(wireframeGeo, sphereMat);
          planetGroup.add(planetMesh);

          // 2. Pontos na Superfície
          const ptsCount = 350;
          const ptsGeo = new THREE.BufferGeometry();
          const ptsPos = new Float32Array(ptsCount * 3);

          for (let i = 0; i < ptsCount * 3; i += 3) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 3.85;

            ptsPos[i] = r * Math.sin(phi) * Math.cos(theta);
            ptsPos[i + 1] = r * Math.sin(phi) * Math.sin(theta);
            ptsPos[i + 2] = r * Math.cos(phi);
          }

          ptsGeo.setAttribute('position', new THREE.BufferAttribute(ptsPos, 3));
          const ptsMat = new THREE.PointsMaterial({ size: 0.06, color: 0x0284c7, transparent: true, opacity: 0.4 });
          const planetDots = new THREE.Points(ptsGeo, ptsMat);
          planetGroup.add(planetDots);

          // 3. Anel Cibernético
          const ringGeo = new THREE.RingGeometry(5.0, 6.2, 48);
          const ringWire = new THREE.WireframeGeometry(ringGeo);
          const ringMat = new THREE.LineBasicMaterial({ color: 0x1e293b, transparent: true, opacity: 0.2 });
          const planetRing = new THREE.LineSegments(ringWire, ringMat);
          planetRing.rotation.x = Math.PI / 2.5;
          planetGroup.add(planetRing);

          scene.add(planetGroup);
          camera.position.z = 14;

          let targetZ = 14;
          const handleScroll = () => {
            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            const scrollRatio = Math.min(1, Math.max(0, window.scrollY / (maxScroll || 1)));
            targetZ = 14 - scrollRatio * 6.5;
          };

          window.addEventListener('scroll', handleScroll, { passive: true });

          let animId;
          const animate = () => {
            animId = requestAnimationFrame(animate);

            planetGroup.rotation.y += 0.0012;
            planetGroup.rotation.x += 0.0004;

            camera.position.z += (targetZ - camera.position.z) * 0.05;

            renderer.render(scene, camera);
          };
          animate();

          const handleResize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);

            if (window.innerWidth < 768) {
              planetGroup.position.set(0, -1, -1);
            } else {
              planetGroup.position.set(4.5, 0.5, -1);
            }
          };
          window.addEventListener('resize', handleResize);
          handleResize();

          return () => {
            window.removeEventListener('scroll', handleScroll);
            window.removeEventListener('resize', handleResize);
            cancelAnimationFrame(animId);
          };
        }, []);

        return null;
      }
